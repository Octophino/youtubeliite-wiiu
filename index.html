<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>YouTube Liite</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load YouTube Custom Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="wii-cyan">YouTube</span> <span class="yt-red">Liite</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-btn active" id="tab-home" onclick="switchTab('home')">[ HOME ]</button>
      <button class="nav-btn" id="tab-search" onclick="switchTab('search')">[ SEARCH ]</button>
      <button class="nav-btn" id="tab-favorites" onclick="switchTab('favorites')">[ FAVORITES ]</button>
      <button class="nav-btn" id="tab-history" onclick="switchTab('history')">[ HISTORY ]</button>
    </nav>
  </header>

  <main class="container">

    <!-- CUSTOM PLAYER SECTION (Digiview Style) -->
    <section id="player-section" class="player-section hidden">
      <div class="player-card">
        <div class="player-wrapper">
          <!-- The API will inject the chromeless video here -->
          <div id="player-container"></div>
        </div>
        
        <!-- Custom UI Controls -->
        <div class="custom-controls">
          <button class="ctrl-btn" onclick="ctrlPlay()">PLAY</button>
          <button class="ctrl-btn" onclick="ctrlPause()">PAUSE</button>
          <button class="ctrl-btn" onclick="ctrlStop()">STOP</button>
          <button class="ctrl-btn" onclick="ctrlMute()">MUTE</button>
        </div>

        <div class="player-footer">
          <div class="video-info">
            <h2 id="player-title">Loading...</h2>
            <p id="player-channel">Loading...</p>
          </div>
          <div class="player-actions">
            <button class="btn btn-fav" id="btn-toggle-fav" onclick="toggleCurrentFavorite()">FAVORITE</button>
            <button class="btn btn-close" onclick="closePlayer()">CLOSE</button>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 1: HOME -->
    <section id="view-home" class="view-page">
      <div class="quick-bar">
        <input type="text" id="quick-input" placeholder="Paste link (e.g., youtu.be/...)">
        <button class="btn btn-primary" onclick="handleQuickPlay()">PLAY LINK</button>
      </div>

      <div class="section-header"><h3>SAVED FAVORITES</h3></div>
      <div id="home-favorites-grid" class="cards-grid"></div>

      <div class="section-header"><h3>RECENTLY WATCHED</h3></div>
      <div id="home-history-grid" class="cards-grid"></div>
    </section>

    <!-- TAB 2: SEARCH -->
    <section id="view-search" class="view-page hidden">
      <div class="search-bar-container">
        <input type="text" id="search-query" placeholder="Search videos...">
        <button class="btn btn-primary" onclick="executeSearch()">SEARCH</button>
      </div>
      <div id="search-status" class="status-msg"></div>
      <div id="search-results-grid" class="cards-grid"></div>
    </section>

    <!-- TAB 3: FAVORITES -->
    <section id="view-favorites" class="view-page hidden">
      <div class="section-header"><h3>ALL FAVORITES</h3></div>
      <div id="fav-videos-grid" class="cards-grid"></div>
    </section>

    <!-- TAB 4: HISTORY -->
    <section id="view-history" class="view-page hidden">
      <div class="history-actions">
        <h3>WATCH HISTORY</h3>
        <button class="btn btn-danger" onclick="clearHistory()">CLEAR HISTORY</button>
      </div>
      <div id="history-grid" class="cards-grid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
